admin:
  existingSecret: grafana-admin-secret

service:
  type: LoadBalancer
  ports:
    http: 3000

datasources:
  secretName: grafana-datasources-secret

dashboardsProvider:
  enabled: true

dashboardsConfigMaps:
  - configMapName: node-dashboard
    fileName: node-dashboard.json

smtp:
  enabled: true
  host: smtp.sendgrid.net:465
  user: apikey
  fromAddress: ruabdrakhmanov@gmail.com
  skipVerify: true

notifiers:
  configMapName: grafana-contact-points
